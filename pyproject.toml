[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[project]
name = "nse"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.25",
    "duckdb>=1.4.3",
    "httpx>=0.28.1",
    "pandera[polars]>=0.29.0",
    "polars>=1.37.1",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "s3fs>=2026.1.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pandas>=3.0.0",
    "pyarrow>=23.0.0",
]

[project.scripts]
nse = "nse.main:main"
